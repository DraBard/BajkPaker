# fly.toml app configuration file generated for product-service on 2025-05-18T19:26:33+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'product-service'
primary_region = 'waw'

[build]

[env]
  ALLOWED_ORIGINS = 'https://bajkpaker.fly.dev'
  DB_ECHO = 'False'
  ENVIRONMENT = 'production'
  SQLITE_PATH = '/data/product_service.db'

[[mounts]]
  source = 'product_data'
  destination = '/data'

[http_service]
  internal_port = 8001
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
