# fly.toml app configuration file generated for product-service on 2025-05-16T22:05:45+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'product-service'
primary_region = 'waw'

[build]
  dockerfile = 'Dockerfile'

[env]
  DB_ECHO = 'False'
  DB_NAME = 'bajkpaker_dev.db'
  ENVIRONMENT = 'production'
  LOG_LEVEL = 'info'
  ALLOWED_ORIGINS = 'https://bajkpaker.fly.dev,http://localhost:3000'

[[mounts]]
  source = 'sqlite_data'
  destination = '/data'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
