# fly.toml app configuration file for user-service
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'user-service'
primary_region = 'waw'

[build]

[env]
  ALLOWED_ORIGINS = 'https://bajkpaker.fly.dev,https://order-service.fly.dev,https://product-service.fly.dev'
  DB_ECHO = 'False'
  ENVIRONMENT = 'production'
  # SQLite-specific config
  SQLITE_PATH = '/data/user_service.db'

# Mount volume for SQLite database
[[mounts]]
  source = 'user_data'
  destination = '/data'

[http_service]
  internal_port = 8003
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  size = 'shared-cpu-1x'
